<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />

    {% block meta %}
      <title>{{ site_name }} — {{ site_tagline }}</title>
      <meta name="description" content="Publish videos and images of your robot. Capture, post, share." />

      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="{{ site_name }}" />
      <meta property="og:title" content="{{ site_name }}" />
      <meta property="og:description" content="{{ site_tagline }}" />
      <meta property="og:url" content="{{ request.url }}" />
      <meta property="og:image" content="{{ url_for('static', filename=og_default_image) }}" />
      <meta name="twitter:card" content="summary_large_image" />
    {% endblock %}

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}" />
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/main.css') }}?v={{ asset_hash }}" />
    {% block head_preload %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    {% include "partials/nav.html" %}

    <main id="main" tabindex="-1">
      {% include "partials/flash.html" %}
      {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script src="{{ url_for('static', filename='js/main.js') }}?v={{ asset_hash }}" defer></script>
  </body>
</html>
