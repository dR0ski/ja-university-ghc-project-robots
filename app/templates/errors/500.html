{% extends "base.html" %}
{% block meta %}<title>Server error — {{ site_name }}</title>{% endblock %}
{% block content %}
<section class="auth-shell"><div class="container"><div class="form stack">
  <h1 class="form__title">Something broke on our end.</h1>
  <p>We've been notified. Try again in a moment.</p>
  <p class="form__hint">Reference: <code>{{ request_id }}</code></p>
  <a class="btn btn--ghost" href="{{ url_for('public.splash') }}">Home</a>
</div></div></section>
{% endblock %}
