[project]
name = "robot-media-app"
version = "0.1.0"
description = "Production-grade Flask app: marketing splash + secure registration."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "Flask==3.0.*",
    "Flask-SQLAlchemy==3.1.*",
    "Flask-Migrate==4.0.*",
    "Flask-WTF==1.2.*",
    "Flask-Limiter==3.8.*",
    "flask-talisman==1.1.*",
    "SQLAlchemy==2.0.*",
    "psycopg[binary]==3.2.*",
    "argon2-cffi==23.*",
    "email-validator==2.*",
    "python-dotenv==1.*",
    "python-json-logger==2.*",
    "gunicorn==22.*",
    "redis==5.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-flask==1.3.*",
    "pytest-cov==5.*",
    "pytest-randomly==3.*",
    "coverage[toml]==7.*",
    "testcontainers[postgres]==4.*",
    "factory-boy==3.*",
    "Faker>=25",
    "ruff==0.6.*",
    "mypy==1.11.*",
    "types-redis",
    "pre-commit==3.*",
    "bandit==1.*",
    "pip-audit==2.*",
    "sentry-sdk[flask]==2.*",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C90", "N", "SIM", "RUF", "ASYNC", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501", "N999"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
    "integration: requires docker / postgres testcontainer",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/__main__.py",
    "migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
