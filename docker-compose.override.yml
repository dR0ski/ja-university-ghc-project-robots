# Dev override — applied automatically by `docker compose up`.
# Mounts source for hot-reload and runs Flask's debug server.
services:
  web:
    command: ["flask", "--app", "wsgi", "run", "--host", "0.0.0.0", "--port", "8000", "--debug"]
    environment:
      FLASK_ENV: development
      LOG_JSON: "false"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./wsgi.py:/app/wsgi.py
    read_only: false
